server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker DNS resolver so upstream IPs are refreshed on container restarts
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy GraphQL API calls including WebSockets
    location /graphql {
        set $upstream_graphql listener-api;
        proxy_pass http://$upstream_graphql:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy transfer REST API to listener-api
    location /api/Transfer {
        set $upstream_transfer listener-api;
        proxy_pass http://$upstream_transfer:80;
        proxy_set_header Host $host;
    }

    # Proxy bank account REST API to transfer-api
    location /api/bankaccounts {
        set $upstream_bank transfer-api;
        proxy_pass http://$upstream_bank:80;
        proxy_set_header Host $host;
    }
}
