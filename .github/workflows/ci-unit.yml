name: CI - Unit Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            9.0.x

      - name: Restore
        run: dotnet restore PayrollService.sln

      - name: Build
        run: dotnet build PayrollService.sln --no-restore

      - name: Unit Tests - PayrollService
        run: dotnet test tests/PayrollService.UnitTests/ --no-build --logger "trx;LogFileName=payroll-results.trx"

      - name: Unit Tests - TransferService
        run: dotnet test tests/TransferService.UnitTests/ --no-build --logger "trx;LogFileName=transfer-results.trx"

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
