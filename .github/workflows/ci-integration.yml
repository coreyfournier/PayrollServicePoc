name: CI - Integration Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  payroll-db-tests:
    name: PayrollService Database Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            9.0.x

      - name: Restore
        run: dotnet restore tests/PayrollService.DatabaseTests/

      - name: Build
        run: dotnet build tests/PayrollService.DatabaseTests/ --no-restore

      - name: Test
        run: dotnet test tests/PayrollService.DatabaseTests/ --no-build --logger "trx;LogFileName=payroll-db-results.trx"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/TestResults/*.trx'
          check_name: PayrollService DB Test Results

